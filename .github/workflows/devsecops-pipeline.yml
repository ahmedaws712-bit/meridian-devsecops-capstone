name: DevSecOps Pipeline

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  devsecops-security-gates:
    name: DevSecOps Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static app files
        run: |
          test -f app/index.html
          test -f app/styles.css
          test -f app/app.js
          echo "Static application files exist."

      - name: Secrets scan with GitLeaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source="/repo" --no-git --redact --verbose

      - name: SAST scan with Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:latest \
            semgrep scan --config=p/owasp-top-ten --error /src/app

      - name: IaC scan with Checkov
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            bridgecrew/checkov:latest \
            -d /repo/infra \
            --framework terraform

      - name: IaC scan with Terrascan - AWS
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            tenable/terrascan:latest \
            scan -d /repo/infra/aws -i terraform -t aws

      - name: IaC scan with Terrascan - Azure
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            tenable/terrascan:latest \
            scan -d /repo/infra/azure -i terraform -t azure

      - name: OPA policy check
        run: |
          VIOLATIONS=$(docker run --rm \
            -v "$PWD:/repo" \
            openpolicyagent/opa:latest \
            eval \
            --format raw \
            -d /repo/policies/opa/security.rego \
            -i /repo/policies/input/resources.json \
            "count(data.capstone.security.deny)")

          echo "OPA violations: $VIOLATIONS"

          if [ "$VIOLATIONS" != "0" ]; then
            docker run --rm \
              -v "$PWD:/repo" \
              openpolicyagent/opa:latest \
              eval \
              --format pretty \
              -d /repo/policies/opa/security.rego \
              -i /repo/policies/input/resources.json \
              "data.capstone.security.deny"

            exit 1
          fi

      - name: Compliance policy check with OPA
        run: |
          COMPLIANCE_VIOLATIONS=$(docker run --rm \
            -v "$PWD:/repo" \
            openpolicyagent/opa:latest \
            eval \
            --format raw \
            -d /repo/policies/compliance/compliance.rego \
            -i /repo/policies/compliance/compliance-input.json \
            "count(data.capstone.compliance.deny)")

          echo "Compliance violations: $COMPLIANCE_VIOLATIONS"

          if [ "$COMPLIANCE_VIOLATIONS" != "0" ]; then
            docker run --rm \
              -v "$PWD:/repo" \
              openpolicyagent/opa:latest \
              eval \
              --format pretty \
              -d /repo/policies/compliance/compliance.rego \
              -i /repo/policies/compliance/compliance-input.json \
              "data.capstone.compliance.deny"

            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build -t meridian-static-app:ci .

      - name: Container scan with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            meridian-static-app:ci

      - name: Generate SBOM with Syft
        run: |
          mkdir -p sbom-reports

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/sbom-reports:/sbom" \
            anchore/syft:latest \
            meridian-static-app:ci \
            -o spdx-json=/sbom/meridian-static-app-sbom.spdx.json

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest \
            meridian-static-app:ci \
            -o table \
            > sbom-reports/meridian-static-app-sbom.txt

      - name: Upload SBOM report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-report
          path: sbom-reports/

      - name: Create local test network
        run: |
          docker network create capstone-net

      - name: Deploy app to local test target
        run: |
          docker run -d \
            --name meridian-static-app-container \
            --network capstone-net \
            meridian-static-app:ci

          sleep 5
          docker ps

      - name: DAST scan with OWASP ZAP
        run: |
          mkdir -p zap-reports

          docker run --rm \
            --network capstone-net \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://meridian-static-app-container:8080 \
            -r zap-baseline-report.html \
            -J zap-baseline-report.json \
            -w zap-baseline-report.md \
            -I

      - name: Upload ZAP DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: zap-reports/

      - name: Clean up local test target
        if: always()
        run: |
          docker rm -f meridian-static-app-container || true
          docker network rm capstone-net || true
