- rule: Terminal shell in Meridian container
  desc: Detect shell execution inside the Meridian application container
  condition: >
    spawned_process and container and
    k8s.ns.name = "meridian-devsecops" and
    proc.name in (bash, sh, ash, zsh)
  output: >
    Shell spawned in Meridian container
    (user=%user.name command=%proc.cmdline container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [process, shell, meridian, runtime]

- rule: Sensitive file read in Meridian container
  desc: Detect attempts to read sensitive Linux files inside the Meridian application container
  condition: >
    open_read and container and
    k8s.ns.name = "meridian-devsecops" and
    fd.name in (/etc/shadow, /etc/passwd, /etc/sudoers)
  output: >
    Sensitive file read in Meridian container
    (file=%fd.name user=%user.name command=%proc.cmdline pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [filesystem, sensitive_files, meridian, runtime]

- rule: Package manager executed in Meridian container
  desc: Detect package manager execution inside the Meridian application container
  condition: >
    spawned_process and container and
    k8s.ns.name = "meridian-devsecops" and
    proc.name in (apk, apt, apt-get, yum, dnf, microdnf)
  output: >
    Package manager executed in Meridian container
    (user=%user.name command=%proc.cmdline pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [process, package_management, meridian, runtime]
